// ===== PARSER MARKDOWN (mínimo, para o subset usado no manuscrito) =====
function inline(t) {
  t = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/\*(.+?)\*/g, '<em>$1</em>');
  return t;
}
function mdToHtml(md) {
  md = md.replace(/\[\^\d+\]/g, '');
  md = md.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const lines = md.split(/\r?\n/);
  let html = '';
  let para = [];
  const flush = () => { if (para.length) { html += '<p>' + inline(para.join(' ')) + '</p>'; para = []; } };
  for (const line of lines) {
    const t = line.replace(/\r$/, '').trim();
    if (t === '') { flush(); continue; }
    if (t === '---') { flush(); html += '<hr>'; continue; }
    if (/^# (.+)$/.test(t)) { flush(); html += '<h1>' + inline(t.slice(2)) + '</h1>'; continue; }
    if (/^## (.+)$/.test(t)) { flush(); html += '<h2>' + inline(t.slice(3)) + '</h2>'; continue; }
    if (/^&gt;\s*(.*)$/.test(t)) { flush(); html += '<blockquote>' + inline(t.replace(/^&gt;\s*/, '')) + '</blockquote>'; continue; }
    para.push(t);
  }
  flush();
  return html;
}

// ===== ESTADO =====
const STORE = 'metade-leitor-progresso-v1';
const $ = (id) => document.getElementById(id);
const content = $('content');
let current = -1;
let fontSize = 1.06;
let scrollTimer = null;

// ===== PROGRESSO (localStorage do navegador) =====
function saveProgress() {
  const s = { c: current, y: window.scrollY };
  try { localStorage.setItem(STORE, JSON.stringify(s)); } catch (e) {}
}
function loadProgress() {
  try { const raw = localStorage.getItem(STORE); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
}

// ===== CARREGAR CAPÍTULO =====
async function loadChapter(i, scrollY) {
  if (i < 0 || i >= CHAPTERS.length) return;
  current = i;
  content.innerHTML = '<p class="loading">Carregando…</p>';
  try {
    const resp = await fetch(CHAPTERS[i].file);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const md = await resp.text();
    const art = CHAPTERS[i].art
      ? '<figure class="chapter-art"><img src="' + CHAPTERS[i].art + '" alt="' + CHAPTERS[i].alt + '" width="1200" height="800"><figcaption>Ilustração do capítulo</figcaption></figure>'
      : '';
    const rendered = mdToHtml(md);
    if (art) {
      const h2End = rendered.indexOf('</h2>');
      content.innerHTML = h2End >= 0 ? rendered.slice(0, h2End + 5) + art + rendered.slice(h2End + 5) : art + rendered;
    } else {
      content.innerHTML = rendered;
    }
    const words = (content.textContent.match(/\S+/g) || []).length;
    $('readTime').textContent = '≈ ' + Math.max(1, Math.round(words / 220)) + ' min';
  } catch (e) {
    $('readTime').textContent = '';
    content.innerHTML = '<div class="error"><strong>Não foi possível carregar o capítulo.</strong><br><br>' +
      'Este leitor precisa ser servido por <strong>HTTP</strong> — não funciona abrindo o arquivo direto (duplo clique).<br><br>' +
      'Publique no <strong>GitHub Pages</strong> ou rode um servidor local com <code>npx serve</code>.<br><br>' +
      '<small>' + e.message + '</small></div>';
  }
  if (typeof scrollY === 'number') {
    setTimeout(() => window.scrollTo(0, scrollY), 0);
  } else {
    window.scrollTo(0, 0);
  }
  updateUI();
  saveProgress();
  const cap = i >= 1 && i <= 40 ? i : 0;
  const url = new URL(window.location.href);
  if (cap) url.searchParams.set('cap', String(cap)); else url.searchParams.delete('cap');
  history.replaceState(null, '', url.pathname + url.search + url.hash);
  document.title = CHAPTERS[i].title + ' | A Metade Que Me Faltava Era Eu';
}

function updateUI() {
  $('btnPrev').disabled = (current <= 0);
  $('btnNext').disabled = (current >= CHAPTERS.length - 1);
  $('pos').textContent = current === 0 ? 'Início' : current === CHAPTERS.length - 1 ? 'Fim' : current + ' / 40';
  $('title').textContent = CHAPTERS[current] ? CHAPTERS[current].title : 'A Metade Que Me Faltava Era Eu';
  document.querySelectorAll('#tocList a').forEach(a => {
    a.classList.toggle('current', parseInt(a.dataset.i, 10) === current);
  });
  closeToc();
}

// ===== NAVEGAÇÃO =====
function next() { if (current < CHAPTERS.length - 1) loadChapter(current + 1); }
function prev() { if (current > 0) loadChapter(current - 1); }

// ===== ÍNDICE =====
function buildToc() {
  const list = $('tocList');
  list.innerHTML = '';
  CHAPTERS.forEach((ch, i) => {
    const a = document.createElement('a');
    a.href = '#';
    a.dataset.i = i;
    a.textContent = ch.title;
    a.addEventListener('click', (ev) => { ev.preventDefault(); loadChapter(i); });
    list.appendChild(a);
  });
}
function openToc() { $('toc').classList.add('open'); $('overlay').classList.add('show'); }
function closeToc() { $('toc').classList.remove('open'); $('overlay').classList.remove('show'); }

// ===== BARRA DE PROGRESSO (rolagem) =====
function updatePbar() {
  const h = document.documentElement;
  const max = h.scrollHeight - h.clientHeight;
  const pct = max > 0 ? (h.scrollTop / max) * 100 : 0;
  $('pbar').style.width = pct + '%';
}

// ===== TOAST =====
let toastTimer = null;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// ===== CONTROLES (fonte + tema) =====
function applyFont() {
  document.documentElement.style.setProperty('--fs', fontSize.toFixed(2) + 'rem');
  try { localStorage.setItem('metade-leitor-fonte-tamanho', fontSize.toFixed(2)); } catch (e) {}
}
$('btnPlus').addEventListener('click', () => { if (fontSize < 1.5) { fontSize += 0.06; applyFont(); } });
$('btnMinus').addEventListener('click', () => { if (fontSize > 0.85) { fontSize -= 0.06; applyFont(); } });
$('btnFont').addEventListener('click', () => {
  const sans = document.body.classList.toggle('sans');
  try { localStorage.setItem('metade-leitor-tipo', sans ? 'sans' : 'serif'); } catch (e) {}
  $('btnFont').setAttribute('aria-pressed', String(sans));
  toast(sans ? 'Fonte sem serifa' : 'Fonte de livro');
});

const THEMES = ['light', 'sepia', 'dark'];
function applyTheme(theme) {
  document.body.classList.remove('sepia', 'dark');
  if (theme !== 'light') document.body.classList.add(theme);
  const labels = { light: 'Modo claro', sepia: 'Modo sépia', dark: 'Modo escuro' };
  const icons = { light: '☀', sepia: '◐', dark: '●' };
  $('btnTheme').textContent = icons[theme];
  $('btnTheme').title = labels[theme] + ' — toque para mudar';
  $('btnTheme').setAttribute('aria-label', labels[theme] + '. Mudar cores da leitura');
  try { localStorage.setItem('metade-leitor-tema', theme); } catch (e) {}
}
$('btnTheme').addEventListener('click', () => {
  let currentTheme = 'light';
  if (document.body.classList.contains('dark')) currentTheme = 'dark';
  else if (document.body.classList.contains('sepia')) currentTheme = 'sepia';
  const nextTheme = THEMES[(THEMES.indexOf(currentTheme) + 1) % THEMES.length];
  applyTheme(nextTheme);
  toast(nextTheme === 'light' ? 'Modo claro' : nextTheme === 'sepia' ? 'Modo sépia' : 'Modo escuro');
});

// ===== EVENTOS =====
$('btnToc').addEventListener('click', openToc);
$('btnClose').addEventListener('click', closeToc);
$('overlay').addEventListener('click', closeToc);
$('btnNext').addEventListener('click', next);
$('btnPrev').addEventListener('click', prev);
window.addEventListener('scroll', () => {
  updatePbar();
  clearTimeout(scrollTimer);
  scrollTimer = setTimeout(saveProgress, 400);
});
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'ArrowRight') next();
  if (ev.key === 'ArrowLeft') prev();
});

// ===== INIT =====
(function init() {
  buildToc();
  try {
    const savedTheme = localStorage.getItem('metade-leitor-tema');
    applyTheme(THEMES.includes(savedTheme) ? savedTheme : 'light');
    if (localStorage.getItem('metade-leitor-tipo') === 'sans') {
      document.body.classList.add('sans');
      $('btnFont').setAttribute('aria-pressed', 'true');
    } else {
      $('btnFont').setAttribute('aria-pressed', 'false');
    }
    const savedSize = Number(localStorage.getItem('metade-leitor-fonte-tamanho'));
    if (savedSize >= .85 && savedSize <= 1.5) fontSize = savedSize;
  } catch (e) {}
  applyFont();
  const requested = Number(new URLSearchParams(window.location.search).get('cap'));
  const saved = loadProgress();
  if (Number.isInteger(requested) && requested >= 1 && requested <= 40) {
    loadChapter(requested);
  } else if (saved && typeof saved.c === 'number' && saved.c > 0) {
    loadChapter(saved.c, saved.y || 0);
    toast('Continuando de onde você parou…');
  } else {
    loadChapter(0);
  }
})();
</script>
</body>
