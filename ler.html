<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Metade Que Me Faltava Era Eu — Leitor</title>
<style>
:root {
  --bg: #fbf6ee;
  --fg: #292521;
  --muted: #8a8378;
  --accent: #b0432e;
  --line: #e8e0d2;
  --header-bg: rgba(251, 246, 238, .92);
  --fs: 1.06rem;
}
body.dark {
  --bg: #171513;
  --fg: #d9d2c5;
  --muted: #6f695f;
  --line: #2c2823;
  --header-bg: rgba(23, 21, 19, .92);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: Georgia, 'Times New Roman', serif;
  transition: background .25s, color .25s;
}
#pbar {
  position: fixed; top: 0; left: 0; height: 3px; width: 0;
  background: var(--accent); z-index: 60;
  transition: width .1s linear;
}
header {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; gap: 12px;
  padding: 10px 16px;
  background: var(--header-bg);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(6px);
}
#title { flex: 1; font-size: .95rem; font-style: italic; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header button {
  background: none; border: 1px solid var(--line); color: var(--fg);
  border-radius: 6px; padding: 6px 10px; cursor: pointer; font-size: .9rem;
  font-family: inherit;
}
header button:hover { border-color: var(--accent); color: var(--accent); }
header a { background: none; border: 1px solid var(--line); color: var(--fg); border-radius: 6px; padding: 6px 10px; text-decoration: none; font-size: .9rem; font-family: inherit; }
header a:hover { border-color: var(--accent); color: var(--accent); }
main {
  max-width: 40rem; margin: 0 auto; padding: 40px 22px 120px;
  font-size: var(--fs); line-height: 1.78; text-align: justify;
  transition: font-size .15s;
}
main h1 { font-size: 1.9em; text-align: center; margin: .6em 0 .4em; line-height: 1.3; }
main h2 { font-size: 1.35em; margin: 1.8em 0 .6em; }
main p { margin: 0 0 1em; }
main hr { border: none; text-align: center; margin: 2.4em auto; }
main hr::before { content: '* * *'; color: var(--muted); letter-spacing: .6em; }
main blockquote { font-style: italic; color: var(--muted); margin: 1.6em 2em; }
main em { font-style: italic; }
main strong { font-weight: bold; }
footer {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px;
  background: var(--header-bg); border-top: 1px solid var(--line);
  backdrop-filter: blur(6px);
}
footer button {
  background: var(--accent); color: #fff; border: none; border-radius: 6px;
  padding: 8px 14px; cursor: pointer; font-size: .92rem; font-family: inherit;
}
footer button:disabled { opacity: .35; cursor: default; }
#pos { color: var(--muted); font-size: .85rem; }
#toc {
  position: fixed; top: 0; bottom: 0; left: 0; width: min(320px, 86vw);
  background: var(--bg); z-index: 80; transform: translateX(-100%);
  transition: transform .25s; border-right: 1px solid var(--line);
  display: flex; flex-direction: column;
}
#toc.open { transform: translateX(0); }
#tocHead { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); font-weight: bold; }
#tocHead button { background: none; border: none; color: var(--fg); cursor: pointer; font-size: 1.1rem; }
#tocList { overflow-y: auto; flex: 1; padding: 8px 0; }
#tocList a {
  display: block; padding: 9px 16px; color: var(--fg); text-decoration: none;
  font-size: .92rem; border-left: 3px solid transparent;
}
#tocList a:hover { background: var(--line); }
#tocList a.current { border-left-color: var(--accent); font-weight: bold; }
#overlay { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 70; display: none; }
#overlay.show { display: block; }
#toast {
  position: fixed; bottom: 74px; left: 50%; transform: translateX(-50%);
  background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 8px;
  font-size: .9rem; z-index: 90; opacity: 0; pointer-events: none; transition: opacity .3s;
}
#toast.show { opacity: 1; }
.loading { color: var(--muted); text-align: center; padding-top: 40px; }
.error { color: var(--accent); text-align: center; padding: 30px 10px; line-height: 1.6; }
</style>
</head>
<body>
<div id="pbar"></div>
<header>
  <a id="btnBack" href="index.html" title="Voltar ao site">←</a>
  <button id="btnToc" title="Índice">☰ <span>Índice</span></button>
  <div id="title">A Metade Que Me Faltava Era Eu</div>
  <div id="controls">
    <button id="btnMinus" title="Diminuir fonte">A−</button>
    <button id="btnPlus" title="Aumentar fonte">A+</button>
    <button id="btnTheme" title="Modo claro/escuro">🌙</button>
  </div>
</header>
<main id="content"><p class="loading">Carregando…</p></main>
<footer>
  <button id="btnPrev">← Anterior</button>
  <span id="pos"></span>
  <button id="btnNext">Próximo →</button>
</footer>
<div id="overlay"></div>
<div id="toc">
  <div id="tocHead"><span>Índice</span><button id="btnClose">✕</button></div>
  <nav id="tocList"></nav>
</div>
<div id="toast"></div>
<script>
// ===== MANIFESTO DE CAPÍTULOS (lê os arquivos .md direto do repositório) =====
const CHAPTERS = [
  { file: '00-PLANEJAMENTO/FRONT_MATTER.md', title: 'Capa / Início' },
  { file: '03-MANUSCRITO/CAP_01_A_ROTINA_INVISIVEL.md', title: 'Capítulo 1 — A Rotina Invisível' },
  { file: '03-MANUSCRITO/CAP_02_O_ANIVERSARIO_ESQUECIDO.md', title: 'Capítulo 2 — O Aniversário Esquecido' },
  { file: '03-MANUSCRITO/CAP_03_A_TENTATIVA_DA_TERAPIA.md', title: 'Capítulo 3 — A Tentativa da Terapia' },
  { file: '03-MANUSCRITO/CAP_04_AS_PEQUENAS_SABOTAGENS.md', title: 'Capítulo 4 — As Pequenas Sabotagens' },
  { file: '03-MANUSCRITO/CAP_05_A_CONVERSA_COM_FERNANDA.md', title: 'Capítulo 5 — A Conversa com Fernanda' },
  { file: '03-MANUSCRITO/CAP_06_A_ULTIMA_TENTATIVA.md', title: 'Capítulo 6 — A Última Tentativa' },
  { file: '03-MANUSCRITO/CAP_07_A_GOTA_DAGUA.md', title: "Capítulo 7 — A Gota D'água" },
  { file: '03-MANUSCRITO/CAP_08_EU_QUERO_ME_SEPARAR.md', title: 'Capítulo 8 — Eu Quero Me Separar' },
  { file: '03-MANUSCRITO/CAP_09_A_CONVERSA_COM_OS_FILHOS.md', title: 'Capítulo 9 — A Conversa com os Filhos' },
  { file: '03-MANUSCRITO/CAP_10_O_VAZIO_BARULHENTO.md', title: 'Capítulo 10 — O Vazio Barulhento' },
  { file: '03-MANUSCRITO/CAP_11_O_PROCESSO.md', title: 'Capítulo 11 — O Processo' },
  { file: '03-MANUSCRITO/CAP_12_O_RECOMECO_FINANCEIRO.md', title: 'Capítulo 12 — O Recomeço Financeiro' },
  { file: '03-MANUSCRITO/CAP_13_A_PRESSAO_DA_FAMILIA.md', title: 'Capítulo 13 — A Pressão da Família' },
  { file: '03-MANUSCRITO/CAP_14_A_PRIMEIRA_SESSAO.md', title: 'Capítulo 14 — A Primeira Sessão' },
  { file: '03-MANUSCRITO/CAP_15_A_NOVA_ROTINA.md', title: 'Capítulo 15 — A Nova Rotina' },
  { file: '03-MANUSCRITO/CAP_16_UM_SABADO_SO_MINHA.md', title: 'Capítulo 16 — Um Sábado Só Minha' },
  { file: '03-MANUSCRITO/CAP_17_VOLTANDO_A_PINTAR.md', title: 'Capítulo 17 — Voltando a Pintar' },
  { file: '03-MANUSCRITO/CAP_18_AS_PEQUENAS_VITORIAS.md', title: 'Capítulo 18 — As Pequenas Vitórias' },
  { file: '03-MANUSCRITO/CAP_19_O_COLEGA_DO_TRABALHO.md', title: 'Capítulo 19 — O Colega do Trabalho' },
  { file: '03-MANUSCRITO/CAP_20_O_GRUPO_DE_MULHERES.md', title: 'Capítulo 20 — O Grupo de Mulheres' },
  { file: '03-MANUSCRITO/CAP_21_A_CULPA_DA_MATERNIDADE.md', title: 'Capítulo 21 — A Culpa da Maternidade' },
  { file: '03-MANUSCRITO/CAP_22_O_PRIMEIRO_NATAL_SOZINHA.md', title: 'Capítulo 22 — O Primeiro Natal Sozinha' },
  { file: '03-MANUSCRITO/CAP_23_O_ANIVERSARIO_DE_LEO.md', title: 'Capítulo 23 — O Aniversário de Léo' },
  { file: '03-MANUSCRITO/CAP_24_O_DIA_EM_QUE_LEO_PERGUNTOU_SOBRE_O_PAI.md', title: 'Capítulo 24 — O Dia em Que Léo Perguntou Sobre o Pai' },
  { file: '03-MANUSCRITO/CAP_25_O_DIA_DAS_MAES.md', title: 'Capítulo 25 — O Dia das Mães' },
  { file: '03-MANUSCRITO/CAP_26_AS_FERIAS_DE_JULHO.md', title: 'Capítulo 26 — As Férias de Julho' },
  { file: '03-MANUSCRITO/CAP_27_O_CONTRASTE.md', title: 'Capítulo 27 — O Contraste' },
  { file: '03-MANUSCRITO/CAP_28_O_PRIMEIRO_SORRISO_REAL.md', title: 'Capítulo 28 — O Primeiro Sorriso Real' },
  { file: '03-MANUSCRITO/CAP_29_O_ENCONTRO.md', title: 'Capítulo 29 — O Encontro' },
  { file: '03-MANUSCRITO/CAP_30_A_RESISTENCIA.md', title: 'Capítulo 30 — A Resistência' },
  { file: '03-MANUSCRITO/CAP_31_O_FIM_E_O_COMECO.md', title: 'Capítulo 31 — O Fim e o Começo' },
  { file: '03-MANUSCRITO/CAP_32_UM_ANO_DEPOIS.md', title: 'Capítulo 32 — Um Ano Depois' },
  { file: '03-MANUSCRITO/CAP_33_AS_CRIANCAS_CONHECEM_DANIEL.md', title: 'Capítulo 33 — As Crianças Conhecem Daniel' },
  { file: '03-MANUSCRITO/CAP_34_A_PRIMEIRA_VIAGEM_A_QUATRO.md', title: 'Capítulo 34 — A Primeira Viagem a Quatro' },
  { file: '03-MANUSCRITO/CAP_35_A_PRIMEIRA_BRIGA.md', title: 'Capítulo 35 — A Primeira Briga' },
  { file: '03-MANUSCRITO/CAP_36_O_PRIMEIRO_PRESENTE.md', title: 'Capítulo 36 — O Primeiro Presente' },
  { file: '03-MANUSCRITO/CAP_37_O_ENCONTRO_COM_A_MAE_DO_DANIEL.md', title: 'Capítulo 37 — O Encontro com a Mãe do Daniel' },
  { file: '03-MANUSCRITO/CAP_38_O_REENCONTRO.md', title: 'Capítulo 38 — O Reencontro' },
  { file: '03-MANUSCRITO/CAP_39_CARTA_PARA_MIM_MESMA.md', title: 'Capítulo 39 — Carta Para Mim Mesma' },
  { file: '03-MANUSCRITO/CAP_40_A_METADE_QUE_ME_FALTAVA_ERA_EU.md', title: 'Capítulo 40 — A Metade Que Me Faltava Era Eu' }
];

// ===== PARSER MARKDOWN (mínimo, para o subset usado no manuscrito) =====
function inline(t) {
  t = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/\*(.+?)\*/g, '<em>$1</em>');
  return t;
}
function mdToHtml(md) {
  md = md.replace(/\[\^\d+\]/g, '');
  md = md.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const lines = md.split(/\r?\n/);
  let html = '';
  let para = [];
  const flush = () => { if (para.length) { html += '<p>' + inline(para.join(' ')) + '</p>'; para = []; } };
  for (const line of lines) {
    const t = line.replace(/\r$/, '').trim();
    if (t === '') { flush(); continue; }
    if (t === '---') { flush(); html += '<hr>'; continue; }
    if (/^# (.+)$/.test(t)) { flush(); html += '<h1>' + inline(t.slice(2)) + '</h1>'; continue; }
    if (/^## (.+)$/.test(t)) { flush(); html += '<h2>' + inline(t.slice(3)) + '</h2>'; continue; }
    if (/^&gt;\s*(.*)$/.test(t)) { flush(); html += '<blockquote>' + inline(t.replace(/^&gt;\s*/, '')) + '</blockquote>'; continue; }
    para.push(t);
  }
  flush();
  return html;
}

// ===== ESTADO =====
const STORE = 'metade-leitor-progresso-v1';
const $ = (id) => document.getElementById(id);
const content = $('content');
let current = -1;
let fontSize = 1.06;
let scrollTimer = null;

// ===== PROGRESSO (localStorage do navegador) =====
function saveProgress() {
  const s = { c: current, y: window.scrollY };
  try { localStorage.setItem(STORE, JSON.stringify(s)); } catch (e) {}
}
function loadProgress() {
  try { const raw = localStorage.getItem(STORE); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
}

// ===== CARREGAR CAPÍTULO =====
async function loadChapter(i, scrollY) {
  if (i < 0 || i >= CHAPTERS.length) return;
  current = i;
  content.innerHTML = '<p class="loading">Carregando…</p>';
  try {
    const resp = await fetch(CHAPTERS[i].file);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const md = await resp.text();
    content.innerHTML = mdToHtml(md);
  } catch (e) {
    content.innerHTML = '<div class="error"><strong>Não foi possível carregar o capítulo.</strong><br><br>' +
      'Este leitor precisa ser servido por <strong>HTTP</strong> — não funciona abrindo o arquivo direto (duplo clique).<br><br>' +
      'Publique no <strong>GitHub Pages</strong> ou rode um servidor local com <code>npx serve</code>.<br><br>' +
      '<small>' + e.message + '</small></div>';
  }
  if (typeof scrollY === 'number') {
    setTimeout(() => window.scrollTo(0, scrollY), 0);
  } else {
    window.scrollTo(0, 0);
  }
  updateUI();
  saveProgress();
}

function updateUI() {
  $('btnPrev').disabled = (current <= 0);
  $('btnNext').disabled = (current >= CHAPTERS.length - 1);
  $('pos').textContent = 'Capítulo ' + current + ' de ' + (CHAPTERS.length - 1);
  document.querySelectorAll('#tocList a').forEach(a => {
    a.classList.toggle('current', parseInt(a.dataset.i, 10) === current);
  });
  closeToc();
}

// ===== NAVEGAÇÃO =====
function next() { if (current < CHAPTERS.length - 1) loadChapter(current + 1); }
function prev() { if (current > 0) loadChapter(current - 1); }

// ===== ÍNDICE =====
function buildToc() {
  const list = $('tocList');
  list.innerHTML = '';
  CHAPTERS.forEach((ch, i) => {
    const a = document.createElement('a');
    a.href = '#';
    a.dataset.i = i;
    a.textContent = ch.title;
    a.addEventListener('click', (ev) => { ev.preventDefault(); loadChapter(i); });
    list.appendChild(a);
  });
}
function openToc() { $('toc').classList.add('open'); $('overlay').classList.add('show'); }
function closeToc() { $('toc').classList.remove('open'); $('overlay').classList.remove('show'); }

// ===== BARRA DE PROGRESSO (rolagem) =====
function updatePbar() {
  const h = document.documentElement;
  const max = h.scrollHeight - h.clientHeight;
  const pct = max > 0 ? (h.scrollTop / max) * 100 : 0;
  $('pbar').style.width = pct + '%';
}

// ===== TOAST =====
let toastTimer = null;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// ===== CONTROLES (fonte + tema) =====
function applyFont() {
  document.documentElement.style.setProperty('--fs', fontSize.toFixed(2) + 'rem');
}
$('btnPlus').addEventListener('click', () => { if (fontSize < 1.5) { fontSize += 0.06; applyFont(); } });
$('btnMinus').addEventListener('click', () => { if (fontSize > 0.85) { fontSize -= 0.06; applyFont(); } });
$('btnTheme').addEventListener('click', () => {
  const dark = document.body.classList.toggle('dark');
  try { localStorage.setItem('metade-leitor-tema', dark ? 'dark' : 'light'); } catch (e) {}
  $('btnTheme').textContent = dark ? '☀️' : '🌙';
});

// ===== EVENTOS =====
$('btnToc').addEventListener('click', openToc);
$('btnClose').addEventListener('click', closeToc);
$('overlay').addEventListener('click', closeToc);
$('btnNext').addEventListener('click', next);
$('btnPrev').addEventListener('click', prev);
window.addEventListener('scroll', () => {
  updatePbar();
  clearTimeout(scrollTimer);
  scrollTimer = setTimeout(saveProgress, 400);
});
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'ArrowRight') next();
  if (ev.key === 'ArrowLeft') prev();
});

// ===== INIT =====
(function init() {
  buildToc();
  try {
    if (localStorage.getItem('metade-leitor-tema') === 'dark') {
      document.body.classList.add('dark');
      $('btnTheme').textContent = '☀️';
    }
  } catch (e) {}
  applyFont();
  const saved = loadProgress();
  if (saved && typeof saved.c === 'number' && saved.c > 0) {
    loadChapter(saved.c, saved.y || 0);
    toast('Continuando de onde você parou…');
  } else {
    loadChapter(0);
  }
})();
</script>
</body>
</html>
